name: diffusers
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bzip2=1.0.8
  - ca-certificates=2026.3.19
  - ld_impl_linux-64=2.44
  - libexpat=2.7.5
  - libffi=3.4.8
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgomp=15.2.0
  - libmpdec=4.0.0
  - libstdcxx=15.2.0
  - libstdcxx-ng=15.2.0
  - libuuid=1.41.5
  - libxcb=1.17.0
  - libzlib=1.3.1
  - lz4-c=1.9.4
  - ncurses=6.5
  - openssl=3.5.6
  - pip=26.0.1
  - pthread-stubs=0.3
  - python=3.14.4
  - python_abi=3.14
  - readline=8.3
  - sqlite=3.51.2
  - tk=8.6.15
  - tzdata=2026a
  - xorg-libx11=1.8.12
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2024.1
  - xz=5.8.2
  - zlib=1.3.1
  - zstd=1.5.7
  - pip:
      # Trimmed from the full conda export (145 pip packages) to the direct
      # imports of the released code under models/, data/, eval/, train/,
      # utils/, losses/ (walked exhaustively), plus torch/torchvision/
      # accelerate/ftfy, which the code does not import directly but
      # diffusers/transformers require internally. Everything else in the
      # original export (nvidia-* CUDA runtime wheels, tokenizers,
      # safetensors, huggingface-hub, grpcio, tensorboard, ...) is a
      # transitive dependency of the packages below, not something this
      # code imports itself -- installing the packages below will pull in
      # whatever transitive versions pip's resolver picks at install time,
      # which is not guaranteed to be byte-identical to this export. Every
      # package this trimming removed was a transitive dependency of one
      # kept below, not something the release imports itself.
      - accelerate==1.13.0
      - diffusers @ git+https://github.com/GenAI-CUEE/diffusers-controlnet.git@3cae5a9369ba9204cb632712e3496e27d40fd51b
      - ftfy==6.3.1
      - h5py==3.16.0
      - matplotlib==3.10.9
      - numpy==2.4.4
      - pandas==3.0.2
      - pillow==12.2.0
      - pyyaml==6.0.3
      - scikit-learn==1.9.0
      - scipy==1.18.0
      - sk-video==1.1.10
      - termcolor==3.3.0
      - torch==2.11.0
      - torchmetrics==1.9.0
      - torchvision==0.26.0
      - tqdm==4.67.3
      - transformers==5.6.2
